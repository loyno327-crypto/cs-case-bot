<!DOCTYPE html>
<html lang="ru" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6f8" />
  <title>CS Case Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="topbar">
      <div class="logo">CS</div>
      <div class="brand">
        <div>
          <div class="brand-name">CS Case Bot</div>
        </div>
      </div>
      <div class="balance-pill" id="balancePill">
        <span id="balanceText">0.00</span>
        <span class="coin">◎</span>
      </div>
      <button class="icon-btn" id="moreBtn" aria-label="Ещё">⋯</button>
    </header>

    <!-- Screens -->
    <main>
      <section class="screen active" id="screen-home"></section>
      <section class="screen" id="screen-cases"></section>
      <section class="screen" id="screen-upgrade"></section>
      <section class="screen" id="screen-clicker"></section>
      <section class="screen" id="screen-profile"></section>
    </main>

    <!-- Bottom nav -->
    <nav class="navbar" id="navbar">
      <button class="nav-item active" data-screen="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Главная
      </button>
      <button class="nav-item" data-screen="cases">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M9 7V4h6v3"/></svg>
        Кейсы
      </button>
      <button class="nav-item" data-screen="upgrade">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V6M6 12l6-6 6 6"/></svg>
        Апгрейд
      </button>
      <button class="nav-item" data-screen="clicker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11V4a2 2 0 1 1 4 0v6"/><path d="M13 10V3a2 2 0 1 1 4 0v9"/><path d="M17 10a2 2 0 1 1 4 0v4a7 7 0 0 1-7 7h-2a7 7 0 0 1-6-4l-2.5-5a2 2 0 0 1 3.5-2L9 15"/></svg>
        Кликер
      </button>
      <button class="nav-item" data-screen="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        Профиль
      </button>
    </nav>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal" id="modalContent"></div>
  </div>

  <div id="toast"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/screens.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
